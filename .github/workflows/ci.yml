name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow numpy
          # Prefer full requirements; continue if heavy wheels fail on runner
          pip install -r requirements.txt || pip install uiautomator2 loguru openai requests
      - name: Run phone-free unit tests
        run: pytest scripts/ -q -k "unit"
        env:
          USE_AI_GOD_PLANNER: "0"
